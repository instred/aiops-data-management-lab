name: AIOps Data Validation

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-data:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Generate sample operational data
        run: python scripts/generate_data.py

      - name: Preprocess operational data
        run: python scripts/preprocess_data.py

      - name: Validate processed dataset
        run: |
          python -c "import pandas as pd; d = pd.read_csv('data/processed/server_metrics_clean.csv'); assert len(d) == 20, f'Expected 20 records, found {len(d)}'; assert d['cpu_percent'].notna().all(), 'Missing CPU values'; assert d['memory_percent'].notna().all(), 'Missing memory values'; assert d['response_time_ms'].notna().all(), 'Missing response times'; assert d['anomaly_flag'].sum() == 3, 'Unexpected anomaly count'; print('Data validation passed')"
